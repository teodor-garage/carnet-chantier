<title>Carnet de Chantier</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#eef0ec; --surface:#ffffff; --surface-2:#f6f6f2;
  --ink:#17212b; --ink-soft:#48534d; --ink-faint:#7a8580;
  --line:#d7dad2; --line-strong:#b9beb2;
  --accent:#d9591c; --accent-ink:#fff8f2; --accent-soft:#f7e2d1; --accent-line:#e8a878;
  --good:#2f7d4f; --good-soft:#e1efe4; --good-line:#a9cdb6;
  --warn:#a8720f; --warn-soft:#f6ecd2; --warn-line:#dbbb70;
  --bad:#c0392b; --bad-soft:#f8e0dd; --bad-line:#e2a89f;
  --info:#2f6f9e; --info-soft:#e1ecf4; --info-line:#a3c4dc;
  --shadow:0 1px 2px rgba(23,33,43,.07), 0 6px 20px rgba(23,33,43,.06);
  --radius:10px;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  --sans:'Source Sans 3',system-ui,-apple-system,sans-serif;
  --display:'Barlow Condensed',var(--sans);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161b; --surface:#191f25; --surface-2:#1e252b;
    --ink:#e8ebe6; --ink-soft:#aab5ad; --ink-faint:#748079;
    --line:#2b333a; --line-strong:#3c4650;
    --accent:#ff7a38; --accent-ink:#1a0f07; --accent-soft:#3a2413; --accent-line:#7a4420;
    --good:#4fb282; --good-soft:#163326; --good-line:#2c5f42;
    --warn:#d9a636; --warn-soft:#382c11; --warn-line:#6b501f;
    --bad:#e5675a; --bad-soft:#3a1c19; --bad-line:#733a32;
    --info:#63a9d6; --info-soft:#152834; --info-line:#2d5570;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#12161b; --surface:#191f25; --surface-2:#1e252b;
  --ink:#e8ebe6; --ink-soft:#aab5ad; --ink-faint:#748079;
  --line:#2b333a; --line-strong:#3c4650;
  --accent:#ff7a38; --accent-ink:#1a0f07; --accent-soft:#3a2413; --accent-line:#7a4420;
  --good:#4fb282; --good-soft:#163326; --good-line:#2c5f42;
  --warn:#d9a636; --warn-soft:#382c11; --warn-line:#6b501f;
  --bad:#e5675a; --bad-soft:#3a1c19; --bad-line:#733a32;
  --info:#63a9d6; --info-soft:#152834; --info-line:#2d5570;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;padding-inline:16px;}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.2px;text-wrap:balance;margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:var(--sans);}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
a{color:var(--accent);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- topbar ---------- */
.topbar{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px 14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{font-size:26px;line-height:1;}
.brand h1{font-size:22px;color:var(--ink);}
.brand-sub{margin:2px 0 0;font-size:12.5px;color:var(--ink-faint);}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap;}

.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;transition:filter .15s;}
.btn:hover{filter:brightness(0.97);}
:root[data-theme="dark"] .btn:hover, @media (prefers-color-scheme:dark){.btn:hover{filter:brightness(1.15);}}
.btn-ghost{background:transparent;border-color:var(--line);}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn-danger{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad);}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:6px;}
.btn:disabled{opacity:.5;cursor:default;}

/* ---------- shell ---------- */
.shell{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start;padding-bottom:40px;}
@media (max-width:900px){.shell{grid-template-columns:1fr;}}

.sidebar{display:flex;flex-direction:column;gap:12px;position:sticky;top:16px;}
@media (max-width:900px){.sidebar{position:static;}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.pad{padding:14px;}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
.kpi{background:var(--surface);padding:11px 12px;}
.kpi-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);}
.kpi-value{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px;}

.searchbox{display:flex;flex-direction:column;gap:8px;padding:10px 12px;}
.searchbox input{width:100%;border:1px solid var(--line-strong);border-radius:7px;padding:7px 9px;background:var(--surface-2);color:var(--ink);font-size:13px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{border:1px solid var(--line-strong);border-radius:100px;padding:3px 10px;font-size:11.5px;font-weight:600;cursor:pointer;background:var(--surface-2);color:var(--ink-soft);}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

.chantier-list{display:flex;flex-direction:column;gap:6px;max-height:min(56vh,560px);overflow-y:auto;padding:2px 2px 8px;}
.chantier-item{position:relative;border:1px solid var(--line);border-radius:8px;padding:9px 30px 9px 10px;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:4px;}
.chantier-item:hover{border-color:var(--line-strong);}
.chantier-item.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.ci-del{position:absolute;top:6px;right:6px;background:none;border:none;color:var(--ink-faint);opacity:.55;cursor:pointer;font-size:12px;padding:3px 5px;border-radius:5px;line-height:1;}
.ci-del:hover{opacity:1;color:var(--bad);background:var(--bad-soft);}
.ci-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
.ci-num{font-family:var(--mono);font-size:11px;color:var(--ink-faint);}
.ci-client{font-weight:600;font-size:13.5px;}
.ci-bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.ci-amount{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);}
.empty-list{padding:18px 10px;text-align:center;color:var(--ink-faint);font-size:13px;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:100px;padding:2px 8px;border:1px solid transparent;}
.badge-brouillon{background:var(--surface-2);color:var(--ink-faint);border-color:var(--line-strong);}
.badge-envoye{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line);}
.badge-signe{background:var(--good-soft);color:var(--good);border-color:var(--good-line);}
.badge-refuse{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line);}
.badge-termine{background:var(--info-soft);color:var(--info);border-color:var(--info-line);}
.badge-example{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);}
.badge-facture{background:var(--info-soft);color:var(--info);border-color:var(--info-line);font-family:var(--mono);text-transform:none;letter-spacing:0;}
.badge-paiement{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:100px;padding:2px 8px;border:1px solid transparent;}
.badge-paiement.attente{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line);}
.badge-paiement.payee{background:var(--good-soft);color:var(--good);border-color:var(--good-line);}

/* ---------- workspace ---------- */
.workspace{min-width:0;display:flex;flex-direction:column;gap:14px;}
.empty-state{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--ink-soft);}
.empty-state h2{font-size:19px;margin-bottom:8px;}
.empty-state p{max-width:440px;margin:0 auto 16px;font-size:13.5px;}

.ws-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start;}
@media (max-width:1050px){.ws-grid{grid-template-columns:1fr;}}
.ws-main{display:flex;flex-direction:column;gap:14px;min-width:0;}
.ws-side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px;}
@media (max-width:1050px){.ws-side{position:static;}}

.ws-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.ws-header-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ws-num{font-family:var(--mono);font-size:13px;color:var(--ink-faint);}
.ws-title{font-size:20px;}
.save-state{font-size:11.5px;color:var(--ink-faint);font-family:var(--mono);}
.save-state.saving{color:var(--warn);}
.save-state.saved{color:var(--good);}

select.statut-select{border:1px solid var(--line-strong);border-radius:100px;padding:4px 10px 4px 12px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:var(--surface-2);color:var(--ink-soft);}

.section{display:flex;flex-direction:column;gap:12px;}
.section-head{display:flex;align-items:baseline;gap:9px;}
.section-no{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:5px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.section-head h3{font-size:16px;}
.section-hint{font-size:12px;color:var(--ink-faint);margin-left:31px;margin-top:-6px;}

.field-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media (max-width:640px){.field-grid{grid-template-columns:1fr 1fr;}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;}
.field.span2{grid-column:span 2;}
.field.span3{grid-column:span 3;}
@media (max-width:640px){.field.span2,.field.span3{grid-column:1/-1;}}
.field label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);border-radius:7px;padding:7px 9px;background:var(--surface-2);color:var(--ink);font-size:13.5px;width:100%;}
.field textarea{resize:vertical;min-height:56px;font-family:var(--sans);}
.field input:focus,.field select:focus,.field textarea:focus{background:var(--surface);}

table.lots{width:100%;border-collapse:collapse;font-size:13px;}
table.lots th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:0 8px 6px;font-weight:600;}
table.lots td{padding:4px 8px;border-top:1px solid var(--line);vertical-align:middle;}
table.lots input,table.lots select{width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:5px 7px;background:var(--surface-2);color:var(--ink);font-size:13px;}
table.lots input.num-in{font-family:var(--mono);text-align:right;}

.ws-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);}
.ws-tab{background:none;border:none;padding:9px 6px;font-family:var(--display);font-size:15.5px;font-weight:600;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.ws-tab:hover{color:var(--ink-soft);}
.ws-tab.active{color:var(--ink);border-bottom-color:var(--accent);}

.piece-card{display:flex;flex-direction:column;gap:12px;}
.piece-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line);}
.piece-name{font-family:var(--display);font-size:17px;font-weight:600;border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:6px;color:var(--ink);flex:1;min-width:140px;}
.piece-name:focus{border-color:var(--line-strong);background:var(--surface-2);}
.subtable-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:5px;}
.piece-options{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);}
.piece-options label{display:flex;align-items:center;gap:6px;cursor:pointer;}
.piece-result{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px;}
.stat-chip{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:12px;display:flex;flex-direction:column;gap:2px;min-width:108px;}
.stat-chip .v{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink);}
.stat-chip .k{color:var(--ink-faint);font-size:10px;text-transform:uppercase;letter-spacing:.03em;}
.metre-row-actions{display:flex;align-items:center;gap:8px;}
.lots-wrap{overflow-x:auto;}
.lot-total{font-family:var(--mono);text-align:right;white-space:nowrap;color:var(--ink-soft);}
.lot-rm{background:transparent;border:none;color:var(--ink-faint);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:5px;}
.lot-rm:hover{color:var(--bad);background:var(--bad-soft);}
.col-designation{min-width:170px;}
.col-num{width:88px;}
.col-unit{width:74px;}

.frais-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
@media (max-width:640px){.frais-row{grid-template-columns:1fr 1fr;}}

.range-row{display:flex;align-items:center;gap:12px;}
.range-row input[type=range]{flex:1;accent-color:var(--accent);}
.range-value{font-family:var(--mono);font-size:17px;font-weight:600;width:56px;text-align:right;}

.photo-zone{border:1px dashed var(--line-strong);border-radius:8px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.photo-thumb{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--line);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb button{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.55);color:#fff;border:none;width:16px;height:16px;border-radius:3px;font-size:10px;cursor:pointer;line-height:1;}
.photo-add{width:64px;height:64px;border-radius:6px;border:1px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);cursor:pointer;font-size:22px;background:var(--surface-2);}

/* recap card */
.recap-card{padding:16px;}
.recap-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:10px;}
.recap-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px solid var(--line);}
.recap-row:last-of-type{border-bottom:none;}
.recap-row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.recap-row.sub .v,.recap-row.sub .k{color:var(--ink-faint);font-size:12px;}
.recap-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:4px;border-top:1px solid var(--line-strong);}
.recap-total .k{font-family:var(--display);font-size:14px;font-weight:600;}
.recap-total .v{font-family:var(--mono);font-size:22px;font-weight:600;}

.gauge{border-radius:8px;padding:10px 12px;margin-top:12px;border:1px solid var(--line);}
.gauge.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad);}
.gauge.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn);}
.gauge.good{background:var(--good-soft);border-color:var(--good-line);color:var(--good);}
.gauge.info{background:var(--info-soft);border-color:var(--info-line);color:var(--info);}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-weight:700;font-size:19px;}
.gauge-label{font-size:12px;font-weight:600;margin-top:2px;}
.gauge-scale{height:6px;border-radius:4px;background:rgba(120,120,120,.22);margin-top:8px;position:relative;overflow:hidden;}
.gauge-fill{position:absolute;inset:0;width:0;border-radius:4px;background:currentColor;transition:width .2s;}

.print-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

/* print sheet, hidden on screen */
#printSheet{display:none;}
@media print{
  body *{visibility:hidden;}
  #printSheet,#printSheet *{visibility:visible;}
  #printSheet{display:block;position:absolute;top:0;left:0;width:100%;padding:0;}
  body{background:#fff;padding:0;}
}
.psheet{position:relative;font-family:var(--sans);color:#1a1a1a;padding:28px;max-width:760px;margin:0 auto;font-size:13px;}
.ps-stamp{position:absolute;top:118px;right:36px;border:3px double #2f7d4f;border-radius:6px;color:#2f7d4f;padding:7px 20px;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:2px;text-transform:uppercase;text-align:center;transform:rotate(-11deg);opacity:.8;pointer-events:none;}
.ps-stamp .sub{display:block;font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:.4px;text-transform:none;margin-top:2px;}
.psheet h2{font-family:var(--display);font-size:22px;margin:0;}
.ps-top{display:flex;justify-content:space-between;gap:24px;border-bottom:2px solid #1a1a1a;padding-bottom:14px;margin-bottom:18px;}
.ps-company{font-size:12px;line-height:1.5;}
.ps-meta{text-align:right;font-size:12px;}
.ps-meta .big{font-family:var(--mono);font-size:15px;font-weight:700;}
.ps-block{margin-bottom:16px;}
.ps-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#666;margin-bottom:4px;}
table.ps-table{width:100%;border-collapse:collapse;margin-bottom:14px;}
table.ps-table th{text-align:left;font-size:10.5px;text-transform:uppercase;border-bottom:1.5px solid #1a1a1a;padding:5px 6px;}
table.ps-table td{padding:6px 6px;border-bottom:1px solid #ccc;font-size:12.5px;}
table.ps-table td.r,table.ps-table th.r{text-align:right;font-family:var(--mono);}
.ps-totals{margin-left:auto;width:260px;}
.ps-totals .row{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;}
.ps-totals .row.grand{font-weight:700;font-size:15px;border-top:2px solid #1a1a1a;padding-top:6px;margin-top:4px;}
.ps-cond{font-size:11px;color:#333;line-height:1.6;border-top:1px solid #999;padding-top:10px;margin-top:18px;}
.ps-sign{display:flex;justify-content:space-between;margin-top:36px;}
.ps-sign div{width:45%;border-top:1px solid #999;padding-top:6px;font-size:11px;color:#555;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,18,14,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal{background:var(--surface);border-radius:var(--radius);max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.modal-close{background:none;border:none;font-size:18px;color:var(--ink-faint);cursor:pointer;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;}
.clause-list{display:flex;flex-direction:column;gap:2px;}
.clause-item{display:flex;align-items:flex-start;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);}
.clause-item:last-child{border-bottom:none;}
.clause-item input{margin-top:3px;flex:none;}
.clause-item label{font-size:13px;color:var(--ink);cursor:pointer;line-height:1.4;}
.ctsheet{font-family:var(--sans);color:#1a1a1a;padding:28px;max-width:760px;margin:0 auto;font-size:12.5px;line-height:1.55;}
.ctsheet h2{font-family:var(--display);font-size:20px;margin:0 0 4px;text-align:center;text-transform:uppercase;letter-spacing:.5px;}
.ctsheet .ct-sub{text-align:center;color:#666;font-size:11px;margin-bottom:20px;}
.ctsheet .ct-parties{display:flex;gap:20px;margin-bottom:18px;}
.ctsheet .ct-party{flex:1;border:1px solid #ccc;border-radius:6px;padding:10px 12px;}
.ctsheet .ct-party .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#777;margin-bottom:4px;}

<script>
(function(){

/* ---------------- constants ---------------- */

var STATUTS = [

];
var UNITES = ['m²','ml','u','forfait','h'];
var LOT_SUGGESTIONS = ['Peinture','Sol PVC / revêtement','Placo / cloison','Faux plafond','Plinthes','Nettoyage fin de chantier','Menuiserie légère','Petites réparations'];

/* ---------------- contrat de sous-traitance : clauses à cocher ----------
   Chaque clause optionnelle correspond à un article du contrat. Les
   sous-points demandés (ex. "obligation de signaler l'humidité", "sol
   irrégulier"...) sont regroupés sous l'article qui les porte plutôt que
   d'avoir une case par phrase — sinon la liste serait ingérable à l'usage.
   Article, Identité, Objet, Prix, Délais, Facturation et Droit applicable
   sont le socle minimal d'un contrat et restent toujours inclus. */
var CLAUSES_ST = [
  {key:'fournitures', label:'Répartition des fournitures (matériaux fournis par vous / matériel fourni par le sous-traitant)'},
  {key:'supplements', label:'Interdiction des suppléments non autorisés + procédure en cas d’imprévu (photos, explication, prix avant intervention)'},
  {key:'horaires', label:'Horaires et contraintes du chantier (accès, copropriété, stationnement, bruit)'},
  {key:'planning', label:'Planning d’intervention et obligation de le respecter'},
  {key:'penalites', label:'Pénalités de retard'},
  {key:'qualite', label:'Qualité d’exécution : règles de l’art, prescriptions fabricants, normes applicables'},
  {key:'etatDesLieux', label:'Obligation de signaler les défauts existants avant travaux (humidité, support, fissures, sol irrégulier)'},
  {key:'protection', label:'Protection du chantier et responsabilité en cas de dégradation'},
  {key:'nettoyage', label:'Nettoyage quotidien et fin de chantier + gestion des déchets'},
  {key:'independance', label:'Personnel, indépendance du sous-traitant et sécurité (EPI, réglementation)'},
  {key:'assurances', label:'Assurances obligatoires et documents administratifs (Kbis, SIRET, RIB, attestation de vigilance)'},
  {key:'socialFiscal', label:'Obligation d’être à jour socialement et fiscalement + interdiction de sous-traiter sans accord écrit'},
  {key:'relationClient', label:'Interdiction de modifier les prestations, négocier les prix ou accepter des travaux supplémentaires directement avec le client'},
  {key:'nonSollicitation', label:'Non-sollicitation de la clientèle (⚠️ clause à faire valider par un juriste avant signature)'},
  {key:'confidentialite', label:'Confidentialité (prix de vente, marges, fichiers clients, conditions commerciales)'},
  {key:'reception', label:'Réception des travaux et levée des réserves'},
  {key:'malfacons', label:'Malfaçons reprises aux frais du sous-traitant'},
  {key:'abandon', label:'Abandon de chantier et résiliation du contrat'},
  {key:'remplacement', label:'Remplacement par une autre entreprise en cas de défaillance grave'},
  {key:'declarationMO', label:'Déclaration de la sous-traitance au maître d’ouvrage (marchés le nécessitant)'}
];
function defaultContratClauses(){
  var o={};
  CLAUSES_ST.forEach(function(c){ o[c.key] = (c.key!=='declarationMO'); });
  return o;
}
function defaultContrat(){
  return {
    stNom:'', stForme:'', stSiret:'', stAdresse:'', stRepresentant:'', stTel:'', stEmail:'',
    descriptionTravaux:'', materiauxFournis:'', materielSousTraitant:'',
    dateDebut:'', dateFin:'', dureeMaxJours:'',
    penaliteMontant:'',
    horaires:'Du lundi au vendredi, 8h–17h, hors jours fériés.',
    contraintes:'',
    regimeTva:'autoliquidation',
    acomptePctST:'', delaiPaiementJours:30,
    modeLitige:'amiable_tribunal', tribunalCompetent:'',
    clauses: defaultContratClauses()
  };
}
function getContrat(ch){
  if(!ch.contrat) ch.contrat = defaultContrat();
  else { ch.contrat.clauses = Object.assign(defaultContratClauses(), ch.contrat.clauses||{}); }
  return ch.contrat;
}

function defaultSettings(){

    nom:'', forme:'SASU', siret:'', adresse:'', tel:'', email:'',
    iban:'', bic:'',

  };
}
function newChantier(numero){
  var now=new Date().toISOString();
  return {
    id:null, numero:numero, statut:'brouillon', isExample:false,
    client:{nom:'',type:'syndic',contact:'',tel:'',email:''},
    adresse:'', dateVisite:'', dateRendu:'', description:'',
    lots:[], transport:0, locationDechets:0, provisionPct:3, margeCiblePct:20,
    photos:[], notes:'', pieces:[],
    validiteJours: state.settings.validiteJoursDefault||30,
    acomptePct: state.settings.acomptePctDefault||30,
    tvaApplicable: state.settings.tvaApplicable!==false,
    tvaPct: state.settings.tvaPct!=null ? state.settings.tvaPct : 20,
    createdAt:now, updatedAt:now
  };
}
function newLot(designation){
  return {id:uid(), designation:designation||'', quantite:'', unite:'m²', prixSousTraitant:0, prixMateriaux:0};
}
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID().slice(0,8);
  return 'l'+Math.random().toString(36).slice(2,10);
}
function newMur(){ return {id:uid(), label:'', hauteur:'', largeur:''}; }
function newOuverture(){ return {id:uid(), type:'porte', largeur:0.83, hauteur:2.04, quantite:1}; }
function newSolZone(){ return {id:uid(), longueur:'', largeur:''}; }
function newPiece(nom){
  return {id:uid(), nom:nom||'', murs:[newMur()], ouvertures:[], sol:[newSolZone()], plafond:true, doubleFace:false};
}

/* ---------------- state ---------------- */
var state = {
  db:null, assetsApi:null, downloadsApi:null, mode:'loading', /* loading | db | local */
  settings: defaultSettings(),
  chantiers: [],
  currentId: null,
  search:'', statusFilter:'tous',
  wsTab:'devis',
  saveTimers:{}
};

var LOCAL_KEY='carnet_chantier_v1';

/* ---------------- storage abstraction ---------------- */
var Store = {
  async init(){
    var db=null, assetsApi=null, downloadsApi=null;
    try{ db = await window.claude.use('db'); }catch(e){ db=null; }
    try{ assetsApi = await window.claude.use('assets'); }catch(e){ assetsApi=null; }
    try{ downloadsApi = await window.claude.use('downloads'); }catch(e){ downloadsApi=null; }
    state.db=db; state.assetsApi=assetsApi; state.downloadsApi=downloadsApi;
    /* alreadyInitialized distinguishes "jamais ouvert sur cet appareil" (on
       propose l'exemple) de "tout supprimé volontairement" (on respecte ce
       choix et on ne réaffiche rien) — sans ça, vider la liste faisait
       réapparaître le chantier d'exemple au rechargement suivant. */
    var alreadyInitialized=false;
    if(db){
      state.mode='db';
      try{
        var setSnap = await db.doc('settings/entreprise').get();
        if(setSnap.exists) state.settings = Object.assign(defaultSettings(), setSnap.data());
      }catch(e){}
      try{
        var metaSnap = await db.doc('meta/carnet').get();
        alreadyInitialized = !!(metaSnap && metaSnap.exists);
      }catch(e){}
      try{
        var q = await db.collection('chantiers').orderBy('updatedAt','desc').limit(500).get();
        state.chantiers = q.docs.map(function(d){ var o=d.data(); o.id=d.id; return o; });
      }catch(e){ state.chantiers=[]; }
    } else {
      state.mode='local';
      var raw=null;
      try{ raw = localStorage.getItem(LOCAL_KEY); }catch(e){}
      alreadyInitialized = raw!=null;
      if(raw){
        try{
          var parsed = JSON.parse(raw);
          state.settings = Object.assign(defaultSettings(), parsed.settings||{});
          state.chantiers = parsed.chantiers||[];
        }catch(e){}
      }
    }
    state.chantiers.forEach(function(c){
      c.pieces=c.pieces||[]; c.photos=c.photos||[]; c.lots=c.lots||[];
      if(c.tvaApplicable==null) c.tvaApplicable = state.settings.tvaApplicable!==false;
      if(c.tvaPct==null) c.tvaPct = state.settings.tvaPct!=null ? state.settings.tvaPct : 20;
    });
    if(state.chantiers.length===0 && !alreadyInitialized){
      await Store.seedExample();
    }
    if(state.mode==='db' && !alreadyInitialized){
      try{ await state.db.doc('meta/carnet').set({initialized:true, at:new Date().toISOString()}); }catch(e){}
    }
  },
  persistLocal(){
    if(state.mode!=='local') return;
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify({settings:state.settings, chantiers:state.chantiers})); }catch(e){}
  },
  async saveSettings(s){
    state.settings = s;
    if(state.mode==='db'){
      try{ await state.db.doc('settings/entreprise').set(s); }catch(e){}
    } else {
      Store.persistLocal();
    }
  },
  async saveChantier(ch){
    ch.updatedAt = new Date().toISOString();
    if(state.mode==='db'){
      var ref = ch.id ? state.db.collection('chantiers').doc(ch.id) : await state.db.collection('chantiers').add(stripId(ch));
      if(ch.id){ await ref.set(stripId(ch)); }
      else { ch.id = ref.id; }
    } else {
      if(!ch.id) ch.id = uid()+uid();
      Store.persistLocal();
    }
    return ch;
  },
  async deleteChantier(id){
    state.chantiers = state.chantiers.filter(function(c){return c.id!==id;});
    if(state.mode==='db'){
      try{ await state.db.collection('chantiers').doc(id).delete(); }catch(e){}
    } else {
      Store.persistLocal();
    }
  },
  async seedExample(){
    var ex = newChantier('DEV-'+new Date().getFullYear()+'-001');
    ex.isExample=true; ex.statut='brouillon';
    ex.client={nom:'SCI Bellevue (exemple)', type:'syndic', contact:'M. Lorrain', tel:'01 00 00 00 00', email:''};
    ex.adresse='14 rue des Tanneurs, 75011 Paris';
    ex.dateVisite = new Date().toISOString().slice(0,10);
    ex.description='Remise en état de 3 bureaux et couloir avant relocation : peinture, sol, faux plafond.';
    ex.lots=[
      Object.assign(newLot('Peinture murs et plafonds'),{quantite:180,unite:'m²',prixSousTraitant:2160,prixMateriaux:720}),
      Object.assign(newLot('Sol PVC'),{quantite:60,unite:'m²',prixSousTraitant:1500,prixMateriaux:900}),
      Object.assign(newLot('Faux plafond'),{quantite:40,unite:'m²',prixSousTraitant:1600,prixMateriaux:640}),
      Object.assign(newLot('Nettoyage fin de chantier'),{quantite:1,unite:'forfait',prixSousTraitant:450,prixMateriaux:0})
    ];
    ex.transport=380; ex.locationDechets=220; ex.provisionPct=3; ex.margeCiblePct=20;
    ex.notes='Exemple fourni pour montrer le calcul — à modifier ou supprimer.';
    ex.pieces=[Object.assign(newPiece('Bureau 1'),{
      murs:[
        Object.assign(newMur(),{label:'Mur 1',hauteur:2.5,largeur:6}),
        Object.assign(newMur(),{label:'Mur 2',hauteur:2.5,largeur:4}),
        Object.assign(newMur(),{label:'Mur 3',hauteur:2.5,largeur:6}),
        Object.assign(newMur(),{label:'Mur 4',hauteur:2.5,largeur:4})
      ],
      ouvertures:[Object.assign(newOuverture(),{type:'porte',largeur:0.83,hauteur:2.04,quantite:1})],
      sol:[Object.assign(newSolZone(),{longueur:6,largeur:4})]
    })];
    await Store.saveChantier(ex);
    state.chantiers.unshift(ex);
  }
};
function stripId(ch){ var c=Object.assign({},ch); delete c.id; return c; }

/* ---------------- computations ---------------- */
function computeTotals(ch){
  var coutMateriaux=0, coutSousTraitance=0;
  (ch.lots||[]).forEach(function(l){ coutMateriaux+=num(l.prixMateriaux); coutSousTraitance+=num(l.prixSousTraitant); });
  var autres = num(ch.transport)+num(ch.locationDechets);
  var sousTotal = coutMateriaux+coutSousTraitance+autres;
  var provision = sousTotal*(num(ch.provisionPct)/100);
  var coutComplet = sousTotal+provision;
  var margePct = Math.min(90, Math.max(0, num(ch.margeCiblePct)));
  var prixVente = margePct<100 ? coutComplet/(1-margePct/100) : coutComplet;
  var margeEuro = prixVente-coutComplet;
  var tauxSurCA = prixVente>0 ? (margeEuro/prixVente*100) : 0;
  return {coutMateriaux:coutMateriaux,coutSousTraitance:coutSousTraitance,autres:autres,sousTotal:sousTotal,
    provision:provision,coutComplet:coutComplet,prixVente:prixVente,margeEuro:margeEuro,tauxSurCA:tauxSurCA};
}
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function eur(v){ return (Math.round(v*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
function eur0(v){ return Math.round(v).toLocaleString('fr-FR')+' €'; }
/* jsPDF's built-in fonts don't reliably render '€' or the narrow no-break
   space toLocaleString('fr-FR') uses for grouping — both can come out as
   a stray glyph (seen as "/"). PDF text stays plain ASCII. */
function eurPdf(v){
  var n=Math.round((v||0)*100)/100;
  var neg=n<0; n=Math.abs(n);
  var parts=n.toFixed(2).split('.');
  var withSep=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (neg?'-':'')+withSep+','+parts[1]+' EUR';
}
/* Same jsPDF glyph limitation applies to any free-text field a user typed
   a '€' or special space into (e.g. the late-payment mention). */
function pdfSafe(str){
  return String(str==null?'':str).replace(/€/g,'EUR').replace(/[  ]/g,' ');
}
function margeBand(t){
  if(t<15) return {level:'bad', label:'À refuser en principe, ou à renégocier'};
  if(t<18) return {level:'warn', label:'Sous l’objectif — à négocier'};
  if(t<20) return {level:'warn', label:'Acceptable'};
  if(t<=25) return {level:'good', label:'Objectif courant'};
  return {level:'info', label:'Très bon chantier, si le prix reste compétitif'};
}
function allocateLotPrices(ch,totals){
  var totalLotCost = totals.coutMateriaux+totals.coutSousTraitance;
  var scale = totals.coutComplet>0 ? totals.prixVente/totals.coutComplet : 0;
  var extra = totals.autres+totals.provision;
  return (ch.lots||[]).map(function(l){
    var cost = num(l.prixSousTraitant)+num(l.prixMateriaux);
    var alloue = totalLotCost>0 ? cost + extra*(cost/totalLotCost) : 0;
    return {lot:l, prixVenteHT: alloue*scale};
  });
}

/* ---------------- calculateur de métré ---------------- */
function computePiece(p){
  var surfaceMursBrute=0, perimetre=0;
  (p.murs||[]).forEach(function(m){ surfaceMursBrute += num(m.hauteur)*num(m.largeur); perimetre += num(m.largeur); });
  var deductionSurface=0, deductionLineaire=0;
  (p.ouvertures||[]).forEach(function(o){
    deductionSurface += num(o.largeur)*num(o.hauteur)*num(o.quantite);
    if(o.type==='porte') deductionLineaire += num(o.largeur)*num(o.quantite);
  });
  var surfaceMurs = Math.max(0, surfaceMursBrute-deductionSurface) * (p.doubleFace?2:1);
  var lineaire = Math.max(0, perimetre-deductionLineaire);
  var surfaceSol=0;
  (p.sol||[]).forEach(function(z){ surfaceSol += num(z.longueur)*num(z.largeur); });
  var surfacePlafond = p.plafond ? surfaceSol : 0;
  return {surfaceMurs:surfaceMurs, lineaire:lineaire, surfaceSol:surfaceSol, surfacePlafond:surfacePlafond};
}
function computeMetreTotals(ch){
  var t={peinture:0, plinthes:0, sol:0, plafond:0};
  (ch.pieces||[]).forEach(function(p){
    var r=computePiece(p);
    t.peinture+=r.surfaceMurs; t.plinthes+=r.lineaire; t.sol+=r.surfaceSol; t.plafond+=r.surfacePlafond;
  });
  return t;
}
function m2(v){ return (Math.round(v*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' m²'; }
function ml(v){ return (Math.round(v*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ml'; }

/* ---------------- rendering: sidebar ---------------- */
function currentYearCount(){
  var y=new Date().getFullYear();
  return state.chantiers.filter(function(c){return (c.numero||'').indexOf('DEV-'+y)===0;}).length;
}
function nextNumero(){
  var y=new Date().getFullYear();
  var n=currentYearCount()+1;
  return 'DEV-'+y+'-'+String(n).padStart(3,'0');
}

/* ---------------- facturation ---------------- */
function currentYearFactureCount(){
  var y=new Date().getFullYear();
  return state.chantiers.filter(function(c){return (c.factureNumero||'').indexOf('FAC-'+y)===0;}).length;
}
function nextNumeroFacture(){
  var y=new Date().getFullYear();
  var n=currentYearFactureCount()+1;
  return 'FAC-'+y+'-'+String(n).padStart(3,'0');
}
/* Le devis se transforme en facture : numéro de facture définitif attribué une
   seule fois (traçabilité légale), le reste reste modifiable. Idempotent. */
function genererFacture(ch){
  if(ch.factureNumero) return;
  ch.factureNumero = nextNumeroFacture();
  ch.factureDate = new Date().toISOString().slice(0,10);
  ch.dateFinChantier = ch.dateFinChantier || ch.dateRendu || ch.factureDate;
  ch.factureDelaiJours = ch.factureDelaiJours!=null ? ch.factureDelaiJours : 30;
  ch.factureAcompteRecu = ch.factureAcompteRecu!=null ? ch.factureAcompteRecu : (num(ch.acomptePct)>0);
  ch.factureStatutPaiement = ch.factureStatutPaiement || 'attente';
}
function computeFactureTotals(ch){
  var t=computeTotals(ch);
  var tva = ch.tvaApplicable ? t.prixVente*(num(ch.tvaPct)/100) : 0;
  var ttc = t.prixVente+tva;
  var acompteHt = t.prixVente*(num(ch.acomptePct)/100);
  var acompteTtc = ch.tvaApplicable ? acompteHt*(1+num(ch.tvaPct)/100) : acompteHt;
  var acompteDeja = ch.factureAcompteRecu ? (ch.factureAcompteMontant!=null ? num(ch.factureAcompteMontant) : acompteTtc) : 0;
  var netAPayer = ttc-acompteDeja;
  return {ht:t.prixVente, tva:tva, ttc:ttc, acompteSuggere:acompteTtc, acompteDeja:acompteDeja, netAPayer:netAPayer};
}

function renderKpis(){
  var el=document.getElementById('kpis');
  var thisMonth = new Date().toISOString().slice(0,7);
  var emisCeMois = state.chantiers.filter(function(c){return (c.updatedAt||'').slice(0,7)===thisMonth && c.statut!=='brouillon';}).length;
  var withTaux = state.chantiers.filter(function(c){return c.statut!=='brouillon';}).map(function(c){return computeTotals(c).tauxSurCA;});
  var margeMoy = withTaux.length ? withTaux.reduce(function(a,b){return a+b;},0)/withTaux.length : null;
  var decides = state.chantiers.filter(function(c){return c.statut==='signe'||c.statut==='refuse'||c.statut==='termine';});
  var signes = state.chantiers.filter(function(c){return c.statut==='signe'||c.statut==='termine';});
  var tauxSignature = decides.length ? Math.round(signes.length/decides.length*100) : null;
  el.innerHTML =

function resizeToDataUrl(file){
  return new Promise(function(resolve,reject){
    var img=new Image();
    var reader=new FileReader();
    reader.onload=function(){
      img.onload=function(){
        var maxDim=1000;
        var scale=Math.min(1, maxDim/Math.max(img.width,img.height));
        var w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        var cnv=document.createElement('canvas'); cnv.width=w; cnv.height=h;
        cnv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cnv.toDataURL('image/jpeg',0.72));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- events ---------------- */
function scheduleSave(ch){
  var el=document.getElementById('saveState');
  if(el){ el.textContent='enregistrement…'; el.className='save-state saving'; }
  clearTimeout(state.saveTimers[ch.id||'new']);
  state.saveTimers[ch.id||'new']=setTimeout(async function(){
    var wasNew = !ch.id;
    await Store.saveChantier(ch);
    if(wasNew){
      state.currentId=ch.id;
    }
    var el2=document.getElementById('saveState');
    if(el2){ el2.textContent='enregistré'; el2.className='save-state saved'; }
    renderKpis(); renderChantierList();
  },600);
}

function bindWorkspaceEvents(ch){
  function bindText(id,path){
    var el=document.getElementById(id);
    if(!el) return;
    el.addEventListener('input',function(){
      setPath(ch,path,el.value);
      if(path==='client.nom'){ var t=document.getElementById('clientTitle'); if(t) t.textContent=el.value||'Nouveau chantier'; }
      scheduleSave(ch);
    });
  }
  bindText('f_client_nom','client.nom');
  bindText('f_client_type','client.type');
  bindText('f_client_contact','client.contact');
  bindText('f_client_tel','client.tel');
  bindText('f_client_email','client.email');
  bindText('f_dateVisite','dateVisite');
  bindText('f_dateRendu','dateRendu');
  bindText('f_adresse','adresse');
  bindText('f_description','description');
  bindText('f_notes','notes');
  bindText('f_acompte','acomptePct');
  bindText('f_validite','validiteJours');
  bindText('f_tvaPct','tvaPct');
  var tvaAppEl=document.getElementById('f_tvaApplicable');
  if(tvaAppEl){
    tvaAppEl.addEventListener('change',function(){
      ch.tvaApplicable=tvaAppEl.checked;
      scheduleSave(ch);
    });
  }

  ['f_transport','f_location','f_provision'].forEach(function(id){
    var el=document.getElementById(id);
    if(!el) return;
    el.addEventListener('input',function(){
      var map={f_transport:'transport',f_location:'locationDechets',f_provision:'provisionPct'};
      ch[map[id]]=el.value===''?0:parseFloat(el.value);
      patchComputed(ch);
      scheduleSave(ch);
    });
  });

  var margeEl=document.getElementById('f_marge');
  if(margeEl){
    margeEl.addEventListener('input',function(){
      ch.margeCiblePct=parseFloat(margeEl.value);
      document.getElementById('margeValueLabel').textContent=ch.margeCiblePct+'%';
      patchComputed(ch);
      scheduleSave(ch);
    });
  }

  var statutEl=document.getElementById('statutSelect');
  if(statutEl){
    statutEl.addEventListener('change',function(){
      ch.statut=statutEl.value;
      if(ch.statut==='termine' && !ch.factureNumero){
        genererFacture(ch);
        state.wsTab='facture';
      }
      scheduleSave(ch);
      renderWorkspace();
    });
  }

  document.getElementById('btnDelete').onclick=async function(){
    if(!confirm('Supprimer ce chantier définitivement ?')) return;
    await Store.deleteChantier(ch.id);
    state.currentId = state.chantiers.length ? state.chantiers[0].id : null;
    renderAll();
  };

  document.getElementById('btnAddLot').onclick=function(){
    ch.lots=ch.lots||[];
    ch.lots.push(newLot(''));
    document.getElementById('lotsTable').innerHTML = lotsTableInner(ch);
    bindLotsTable(ch);
    scheduleSave(ch);
  };

  bindLotsTable(ch);

  document.getElementById('btnPrint').onclick=function(){ printDevis(ch); };
  var pdfBtn=document.getElementById('btnDownloadPdf');
  if(pdfBtn){ pdfBtn.onclick=function(){ downloadPdf(ch); }; }

  var photoInput=document.getElementById('photoInput');
  if(photoInput){
    photoInput.addEventListener('change',async function(){
      var files=Array.prototype.slice.call(photoInput.files||[]);
      for(var i=0;i<files.length;i++){
        try{
          if(state.assetsApi){
            var res=await state.assetsApi.upload(files[i]);
            ch.photos=ch.photos||[];
            ch.photos.push(res.id);
          } else {
            var dataUrl=await resizeToDataUrl(files[i]);
            ch.photos=ch.photos||[];
            ch.photos.push(dataUrl);
          }
        }catch(e){}
      }
      scheduleSave(ch);
      renderWorkspace();
    });
  }
  document.querySelectorAll('.photo-del').forEach(function(btn){
    btn.addEventListener('click',async function(){
      var id=btn.getAttribute('data-photoid');
      ch.photos=(ch.photos||[]).filter(function(p){return p!==id;});
      scheduleSave(ch);
      renderWorkspace();
      if(state.assetsApi && id.indexOf('data:')!==0){ try{ await state.assetsApi.delete(id); }catch(e){} }
    });
  });
}

function bindLotsTable(ch){
  var table=document.getElementById('lotsTable');
  table.querySelectorAll('tr[data-lotid]').forEach(function(row){
    var lotId=row.getAttribute('data-lotid');
    var lot=(ch.lots||[]).filter(function(l){return l.id===lotId;})[0];
    if(!lot) return;
    row.querySelectorAll('[data-field]').forEach(function(inp){
      var field=inp.getAttribute('data-field');
      var evt = inp.tagName==='SELECT' ? 'change':'input';
      inp.addEventListener(evt,function(){
        lot[field] = (field==='prixSousTraitant'||field==='prixMateriaux'||field==='quantite') ? (inp.value===''?'':parseFloat(inp.value)) : inp.value;
        patchComputed(ch);
        scheduleSave(ch);
      });
    });
    var rmBtn=row.querySelector('[data-rm]');
    if(rmBtn){
      rmBtn.addEventListener('click',function(){
        ch.lots=ch.lots.filter(function(l){return l.id!==lotId;});
        table.innerHTML=lotsTableInner(ch);
        bindLotsTable(ch);
        patchComputed(ch);
        scheduleSave(ch);
      });
    }
  });
}

function setPath(obj,path,value){
  var parts=path.split('.');
  var target=obj;
  for(var i=0;i<parts.length-1;i++){ target=target[parts[i]]; }
  target[parts[parts.length-1]]=value;
}

function renderMetreRecap(ch){
  var el=document.getElementById('metreRecapCard');
  if(!el) return;
  var t=computeMetreTotals(ch);
  function row(label,valueStr,key){
    return '<div class="recap-row"><span class="k">'+label+'</span><span class="metre-row-actions"><span class="v">'+valueStr+'</span>'+
      '<button type="button" class="btn btn-ghost btn-sm" data-sendlot="'+key+'">→ Devis</button></span></div>';
  }
  el.innerHTML =
    '<div class="recap-title">Quantités totales du chantier</div>'+
    row('Peinture (murs)', m2(t.peinture), 'peinture')+
    row('Plinthes', ml(t.plinthes), 'plinthes')+
    row('Sol', m2(t.sol), 'sol')+
    row('Plafond', m2(t.plafond), 'plafond')+
    '<div class="section-hint" style="margin:10px 0 0;">Chaque bouton crée un nouveau lot dans le devis avec la quantité mesurée — les prix restent à saisir.</div>';
  el.querySelectorAll('[data-sendlot]').forEach(function(btn){
    btn.addEventListener('click',function(){ sendMetreToLot(ch, btn.getAttribute('data-sendlot')); });
  });
}

function sendMetreToLot(ch,key){
  var t=computeMetreTotals(ch);
  var map={
    peinture:{designation:'Peinture murs et plafonds', quantite:t.peinture, unite:'m²'},
    plinthes:{designation:'Plinthes', quantite:t.plinthes, unite:'ml'},
    sol:{designation:'Revêtement de sol', quantite:t.sol, unite:'m²'},
    plafond:{designation:'Faux plafond', quantite:t.plafond, unite:'m²'}
  };
  var cfg=map[key];
  if(!cfg || cfg.quantite<=0) return;
  var lot=newLot(cfg.designation);
  lot.quantite=Math.round(cfg.quantite*100)/100;
  lot.unite=cfg.unite;
  ch.lots=ch.lots||[];
  ch.lots.push(lot);
  scheduleSave(ch);
  state.wsTab='devis';
  renderWorkspace();
}

/* ---------------- métré: bindings ---------------- */
function bindMetreEvents(ch){
  (ch.pieces||[]).forEach(function(p){ bindPieceEvents(ch,p); });
  var addBtn=document.getElementById('btnAddPiece');
  if(addBtn){
    addBtn.onclick=function(){
      ch.pieces=ch.pieces||[];
      ch.pieces.push(newPiece('Pièce '+(ch.pieces.length+1)));
      scheduleSave(ch);
      renderWorkspace();
    };
  }
}
function patchPieceComputed(ch,p){
  var res=document.getElementById('pieceResult-'+p.id);
  if(res) res.innerHTML=pieceResultHtml(p);
  renderMetreRecap(ch);
}
function bindPieceEvents(ch,p){
  var card=document.getElementById('piece-'+p.id);
  if(!card) return;
  card.querySelectorAll('[data-pf]').forEach(function(inp){
    var f=inp.getAttribute('data-pf');
    var evt=(inp.type==='checkbox')?'change':'input';
    inp.addEventListener(evt,function(){
      p[f]=(inp.type==='checkbox')?inp.checked:inp.value;
      patchPieceComputed(ch,p);
      scheduleSave(ch);
    });
  });
  bindMurRows(ch,p);
  bindOuvRows(ch,p);
  bindZoneRows(ch,p);
  var addMurBtn=card.querySelector('[data-addmur]');
  if(addMurBtn) addMurBtn.onclick=function(){
    p.murs=p.murs||[]; p.murs.push(newMur());
    document.getElementById('mursTable-'+p.id).innerHTML=mursTableInner(p);
    bindMurRows(ch,p); patchPieceComputed(ch,p); scheduleSave(ch);
  };
  var addOuvBtn=card.querySelector('[data-addouv]');
  if(addOuvBtn) addOuvBtn.onclick=function(){
    p.ouvertures=p.ouvertures||[]; p.ouvertures.push(newOuverture());
    document.getElementById('ouverturesTable-'+p.id).innerHTML=ouverturesTableInner(p);
    bindOuvRows(ch,p); patchPieceComputed(ch,p); scheduleSave(ch);
  };
  var addZoneBtn=card.querySelector('[data-addzone]');
  if(addZoneBtn) addZoneBtn.onclick=function(){
    p.sol=p.sol||[]; p.sol.push(newSolZone());
    document.getElementById('solTable-'+p.id).innerHTML=solTableInner(p);
    bindZoneRows(ch,p); patchPieceComputed(ch,p); scheduleSave(ch);
  };
  var rmPieceBtn=card.querySelector('[data-rmpiece]');
  if(rmPieceBtn) rmPieceBtn.onclick=function(){
    if(!confirm('Supprimer cette pièce du métré ?')) return;
    ch.pieces=(ch.pieces||[]).filter(function(x){return x.id!==p.id;});
    scheduleSave(ch);
    renderWorkspace();
  };
}
function bindMurRows(ch,p){
  var table=document.getElementById('mursTable-'+p.id);
  if(!table) return;
  table.querySelectorAll('tr[data-murid]').forEach(function(row){
    var id=row.getAttribute('data-murid');
    var m=(p.murs||[]).filter(function(x){return x.id===id;})[0];
    if(!m) return;
    row.querySelectorAll('[data-mf]').forEach(function(inp){
      var f=inp.getAttribute('data-mf');
      inp.addEventListener('input',function(){
        m[f]=inp.value;
        var cell=document.getElementById('murSurf-'+id);
        if(cell) cell.textContent=m2(num(m.hauteur)*num(m.largeur));
        patchPieceComputed(ch,p); scheduleSave(ch);
      });
    });
    var rm=row.querySelector('[data-rmmur]');
    if(rm) rm.onclick=function(){
      p.murs=p.murs.filter(function(x){return x.id!==id;});
      table.innerHTML=mursTableInner(p);
      bindMurRows(ch,p); patchPieceComputed(ch,p); scheduleSave(ch);
    };
  });
}
function bindOuvRows(ch,p){
  var table=document.getElementById('ouverturesTable-'+p.id);
  if(!table) return;
  table.querySelectorAll('tr[data-ouvid]').forEach(function(row){
    var id=row.getAttribute('data-ouvid');
    var o=(p.ouvertures||[]).filter(function(x){return x.id===id;})[0];
    if(!o) return;
    row.querySelectorAll('[data-of]').forEach(function(inp){
      var f=inp.getAttribute('data-of');
      var evt=(inp.tagName==='SELECT')?'change':'input';
      inp.addEventListener(evt,function(){
        o[f]=(f==='type')?inp.value:inp.value;
        var cell=document.getElementById('ouvSurf-'+id);
        if(cell) cell.textContent=m2(num(o.largeur)*num(o.hauteur)*num(o.quantite));
        patchPieceComputed(ch,p); scheduleSave(ch);
      });
    });
    var rm=row.querySelector('[data-rmouv]');
    if(rm) rm.onclick=function(){
      p.ouvertures=p.ouvertures.filter(function(x){return x.id!==id;});
      table.innerHTML=ouverturesTableInner(p);
      bindOuvRows(ch,p); patchPieceComputed(ch,p); scheduleSave(ch);
    };
  });
}
function bindZoneRows(ch,p){
  var table=document.getElementById('solTable-'+p.id);
  if(!table) return;
  table.querySelectorAll('tr[data-zoneid]').forEach(function(row){
    var id=row.getAttribute('data-zoneid');
    var z=(p.sol||[]).filter(function(x){return x.id===id;})[0];
    if(!z) return;
    row.querySelectorAll('[data-zf]').forEach(function(inp){
      var f=inp.getAttribute('data-zf');
      inp.addEventListener('input',function(){
        z[f]=inp.value;
        var cell=document.getElementById('zoneSurf-'+id);
        if(cell) cell.textContent=m2(num(z.longueur)*num(z.largeur));
        patchPieceComputed(ch,p); scheduleSave(ch);
      });
    });
    var rm=row.querySelector('[data-rmzone]');
    if(rm) rm.onclick=function(){
      p.sol=p.sol.filter(function(x){return x.id!==id;});
      table.innerHTML=solTableInner(p);
      bindZoneRows(ch,p); patchPieceComputed(ch,p); scheduleSave(ch);
    };
  });
}

/* ---------------- pdf export ---------------- */
function buildDevisPdf(ch,totalsForPdf,alloc){
  var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
  if(!jsPDFCtor) return null;
  var s = state.settings;
  var doc = new jsPDFCtor({unit:'mm',format:'a4'});
  var M=18, pageW=210, pageH=297, contentW=pageW-M*2;
  var ink=[26,26,26], gray=[100,100,100], lightline=[205,205,205], accent=[217,89,28];
  var y=M;

  function setInk(){ doc.setTextColor(ink[0],ink[1],ink[2]); }
  function setGray(){ doc.setTextColor(gray[0],gray[1],gray[2]); }
  function hr(c,w){ doc.setDrawColor(c[0],c[1],c[2]); doc.setLineWidth(w||0.3); doc.line(M,y,pageW-M,y); }
  function ensureSpace(minH,onBreak){
    if(y > pageH-M-minH){ doc.addPage(); y=M; if(onBreak) onBreak(); return true; }
    return false;
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(17); setInk();
  doc.text(pdfSafe(s.nom||'Votre entreprise'), M, y+4);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); setGray();
  var hLines=[];
  if(s.forme) hLines.push(pdfSafe(s.forme));
  if(s.siret) hLines.push('SIRET '+pdfSafe(s.siret));
  if(s.adresse) hLines.push(pdfSafe(s.adresse));
  var contactLine=[s.tel,s.email].filter(Boolean).map(pdfSafe).join('   -   ');
  if(contactLine) hLines.push(contactLine);
  var hy=y+10;
  hLines.forEach(function(l){ doc.text(l,M,hy); hy+=4.2; });

  doc.setFont('helvetica','bold'); doc.setFontSize(13); setInk();
  doc.text('DEVIS '+(ch.numero||''), pageW-M, y+4, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9); setGray();
  doc.text('Date : '+new Date().toLocaleDateString('fr-FR'), pageW-M, y+10, {align:'right'});
  doc.text('Validité : '+(ch.validiteJours||30)+' jours', pageW-M, y+14.2, {align:'right'});

  y = Math.max(hy, y+18)+4;
  hr(accent,0.9); y+=8;

  doc.setFont('helvetica','bold'); doc.setFontSize(8); setGray();
  doc.text('CLIENT', M, y); y+=5;
  doc.setFont('helvetica','bold'); doc.setFontSize(11); setInk();
  doc.text(pdfSafe(ch.client.nom)||'-', M, y); y+=5.2;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); setGray();
  if(ch.adresse){ doc.text(pdfSafe(ch.adresse), M, y); y+=4.6; }
  if(ch.client.contact){ doc.text('A l\'attention de '+pdfSafe(ch.client.contact), M, y); y+=4.6; }
  y+=3;

  doc.setFont('helvetica','bold'); doc.setFontSize(8); setGray();
  doc.text('OBJET', M, y); y+=5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); setInk();
  doc.splitTextToSize(pdfSafe(ch.description||'Travaux de rénovation intérieure'), contentW).forEach(function(l){ doc.text(l,M,y); y+=4.6; });
  y+=4;

  function tableHeader(){
    doc.setFont('helvetica','bold'); doc.setFontSize(8.3); setGray();
    doc.text('DÉSIGNATION', M, y);
    doc.text('QUANTITÉ', M+100, y, {align:'right'});
    doc.text('PRIX UNIT. HT', M+140, y, {align:'right'});
    doc.text('TOTAL HT', pageW-M, y, {align:'right'});
    y+=2.5; hr(ink,0.4); y+=5;
  }
  tableHeader();
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  (alloc||[]).forEach(function(a){
    ensureSpace(22, tableHeader);
    var l=a.lot; var qte=num(l.quantite);
    var unitPrice = qte>0 ? a.prixVenteHT/qte : null;
    setInk();
    var nameLines=doc.splitTextToSize(pdfSafe(l.designation)||'-', 88);
    doc.text(nameLines, M, y);
    setGray();
    doc.text(qte>0 ? (qte+' '+(l.unite==='forfait'?'':l.unite==='m²'?'m2':l.unite)) : (l.unite==='forfait'?'forfait':'—'), M+100, y, {align:'right'});
    doc.text(unitPrice!==null ? eurPdf(unitPrice) : '—', M+140, y, {align:'right'});
    setInk();
    doc.text(eurPdf(a.prixVenteHT), pageW-M, y, {align:'right'});

function browserDownloadBlob(blob,filename){
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },4000);
}

/* Tampon "PAYÉE" façon tampon encreur : double bordure rectangulaire tournée
   + texte tourné au même angle. jsPDF ne fournit pas de rect() incliné, donc
   on fait tourner les 4 coins à la main et on trace le contour avec lines(). */
function drawPaidStamp(doc,pageW,dateStr,color){
  var cx=pageW-70, cy=64, w=56, h=24, angle=-12;
  var rad=angle*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad);
  function rot(px,py){ return [px*cos-py*sin+cx, px*sin+py*cos+cy]; }
  function borderAt(margin){
    var hw=w/2-margin, hh=h/2-margin;
    var c=[rot(-hw,-hh),rot(hw,-hh),rot(hw,hh),rot(-hw,hh)];
    var deltas=[
      [c[1][0]-c[0][0],c[1][1]-c[0][1]],
      [c[2][0]-c[1][0],c[2][1]-c[1][1]],
      [c[3][0]-c[2][0],c[3][1]-c[2][1]],
      [c[0][0]-c[3][0],c[0][1]-c[3][1]]
    ];
    doc.lines(deltas, c[0][0], c[0][1], [1,1], 'S', true);
  }
  var gsOn=false;
  try{ doc.saveGraphicsState(); doc.setGState(new doc.GState({opacity:0.62})); gsOn=true; }catch(e){}
  doc.setDrawColor(color[0],color[1],color[2]);
  doc.setTextColor(color[0],color[1],color[2]);
  doc.setLineWidth(1.1); borderAt(0);
  doc.setLineWidth(0.5); borderAt(2.4);
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('PAYÉE', cx, cy-2, {angle:angle, align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text('le '+dateStr, cx, cy+5.5, {angle:angle, align:'center'});
  if(gsOn){ try{ doc.restoreGraphicsState(); }catch(e){} }
}

      'Avant le début du chantier, le Sous-traitant remet à l’Entreprise principale : un extrait Kbis ou justificatif d’immatriculation de moins de 3 mois, les attestations d’assurance (responsabilité civile professionnelle et, le cas échéant, garantie décennale) couvrant exactement les travaux à réaliser et en cours de validité, ainsi qu’un relevé d’identité bancaire (RIB).',
      'Si le montant du présent contrat est égal ou supérieur à 5 000 € HT, le Sous-traitant fournit également une attestation de vigilance URSSAF de moins de 6 mois, conformément à l’article L. 8222-1 du Code du travail.'
    ]);
  }
  if(cl.socialFiscal){
    art('Obligations sociales, fiscales et sous-traitance', [
      'Le Sous-traitant certifie être à jour de ses obligations sociales et fiscales pendant toute la durée du contrat et s’engage à le rester.',
      'Il lui est interdit de sous-traiter à son tour tout ou partie des travaux confiés sans l’accord écrit préalable de l’Entreprise principale.'
    ]);
  }
  if(cl.relationClient){
    art('Relation avec le client final', [
      'Toutes les demandes, réclamations ou modifications émanant du client final sont exclusivement traitées par l’Entreprise principale.',
      'Il est interdit au Sous-traitant de modifier directement les prestations avec le client, de négocier des prix avec lui, ou de réaliser des travaux supplémentaires qu’il lui aurait demandés directement, sans l’accord préalable de l’Entreprise principale.',
      'Il est également interdit au Sous-traitant de communiquer au client le prix facturé par l’Entreprise principale à ce dernier.'
    ]);
  }
  if(cl.nonSollicitation){
    art('Non-sollicitation de la clientèle', [
      'Pendant la durée du présent contrat et pendant une durée de 12 mois suivant son terme, le Sous-traitant s’engage à ne pas démarcher directement, pour son propre compte ou celui d’un tiers, les clients que l’Entreprise principale lui a présentés dans le cadre de l’exécution du présent contrat.',
      'Cette clause, dont la portée doit rester proportionnée à l’objet du contrat, sera soumise pour validation à un juriste avant signature définitive.'
    ]);
  }
  if(cl.confidentialite){
    art('Confidentialité', [
      'Le Sous-traitant s’engage à garder strictement confidentiels les prix de vente, marges, fichiers clients, conditions commerciales et tout document de l’Entreprise principale dont il aurait connaissance à l’occasion de l’exécution du présent contrat, pendant toute sa durée et après son terme.'
    ]);
  }

  var regimeTxt = c.regimeTva==='autoliquidation'
    ? 'Conformément à l’article 283, 2 nonies du Code général des impôts, la TVA due au titre des travaux sous-traités est autoliquidée par l’Entreprise principale ; le Sous-traitant facture donc hors taxes, en mentionnant « Autoliquidation ».'
    : 'Le Sous-traitant facture ses prestations en appliquant son régime de TVA propre, à valider avec son comptable et celui de l’Entreprise principale.';
  var factParas=[
    'Le Sous-traitant émet sa facture après achèvement des travaux et constat contradictoire de leur bonne exécution, sauf situation intermédiaire expressément prévue ci-après.',
    regimeTxt,
    'Délai de paiement du solde : '+num(c.delaiPaiementJours||30)+' jours à compter de la réception de la facture.'
  ];
  if(c.acomptePctST!==''&&c.acomptePctST!=null && num(c.acomptePctST)>0){
    factParas.splice(1,0,'Un acompte de '+num(c.acomptePctST)+'% du prix forfaitaire est versé au Sous-traitant à la signature du présent contrat, le solde étant réglé selon les modalités ci-dessous.');
  }
  art('Facturation, paiement et TVA', factParas);

  if(cl.reception){
    art('Réception des travaux et réserves', [
      'Les travaux font l’objet d’une vérification contradictoire avec l’Entreprise principale avant validation définitive.',
      'Si des réserves sont formulées, le Sous-traitant s’engage à les lever dans un délai de 8 jours calendaires à compter de leur notification, sauf délai différent convenu entre les parties.'
    ]);
  }
  if(cl.malfacons){
    art('Malfaçons', [
      'Les reprises rendues nécessaires par une malfaçon ou une mauvaise exécution imputable au Sous-traitant sont réalisées à ses frais exclusifs, sans incidence sur le prix convenu au présent contrat.'
    ]);
  }
  if(cl.abandon){
    art('Abandon de chantier et résiliation', [
      'Est considéré comme un abandon de chantier le fait, pour le Sous-traitant, de cesser son intervention ou de refuser de l’achever sans motif légitime.',
      'L’Entreprise principale peut résilier de plein droit le présent contrat, après mise en demeure restée sans effet pendant 48 heures, en cas d’abandon de chantier, de retard important non justifié, d’absence d’assurance en cours de validité, de malfaçons graves ou de non-respect répété des obligations du présent contrat.'
    ]);
  }
  if(cl.remplacement){
    art('Remplacement en cas de défaillance grave', [
      'En cas de défaillance grave du Sous-traitant, l’Entreprise principale peut faire appel à une autre entreprise pour achever les travaux, aux frais du Sous-traitant défaillant, sans préjudice de toute action en réparation du préjudice subi.'
    ]);
  }
  if(cl.declarationMO){
    art('Déclaration au maître d’ouvrage', [
      'Lorsque le marché principal l’exige, l’Entreprise principale procède à la déclaration de sous-traitance auprès du maître d’ouvrage préalablement au début d’intervention du Sous-traitant, conformément à la loi n°75-1334 du 31 décembre 1975.'
    ]);
  }

  var litigeTxt = c.modeLitige==='mediation'
    ? 'En cas de différend, les parties s’engagent à rechercher une solution amiable avant toute saisine d’un médiateur. À défaut d’accord, le litige sera porté devant '+ctBlank(c.tribunalCompetent)+'.'
    : 'En cas de différend, les parties s’engagent à rechercher une solution amiable. À défaut d’accord dans un délai raisonnable, le litige sera porté devant '+ctBlank(c.tribunalCompetent)+'.';
  art('Droit applicable et règlement des litiges', [
    'Le présent contrat est soumis au droit français.',
    litigeTxt
  ]);

  return arts;
}

function buildContratPdf(ch){
  var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
  if(!jsPDFCtor) return null;
  var c=getContrat(ch), s=state.settings;
  var arts=buildContratArticles(ch);
  var doc=new jsPDFCtor({unit:'mm',format:'a4'});
  var M=20, pageW=210, pageH=297, contentW=pageW-M*2;
  var ink=[26,26,26], gray=[100,100,100];
  var y=M;
  function setInk(){ doc.setTextColor(ink[0],ink[1],ink[2]); }
  function setGray(){ doc.setTextColor(gray[0],gray[1],gray[2]); }
  function ensureSpace(minH){ if(y>pageH-M-minH){ doc.addPage(); y=M; return true; } return false; }
  function paragraph(text){
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); setInk();
    doc.splitTextToSize(text, contentW).forEach(function(line){
      ensureSpace(6);
      doc.text(line, M, y);
      y+=4.4;
    });
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(16); setInk();
  doc.text('CONTRAT DE SOUS-TRAITANCE', pageW/2, y+4, {align:'center'});
  y+=9;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); setGray();
  doc.text(pdfSafe('Chantier '+(ch.numero||'')+(ch.adresse?' - '+ch.adresse:'')), pageW/2, y, {align:'center'});
  y+=10;

  var colW=(contentW-8)/2;
  function partyBlock(x,boxY,label,name,lines){
    doc.setDrawColor(200,200,200); doc.setLineWidth(0.3);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); setGray();
    doc.text(label.toUpperCase(), x+3, boxY+5);
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); setInk();
    doc.text(pdfSafe(name)||'-', x+3, boxY+10.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.3); setGray();
    var ly=boxY+15;
    lines.forEach(function(l){ if(l){ doc.text(pdfSafe(l), x+3, ly); ly+=4; } });
    var boxH=Math.max(ly-boxY+2, 24);
    doc.rect(x,boxY,colW,boxH,'S');
    return boxH;
  }
  var startY=y;
  var h1=partyBlock(M, startY, 'Entreprise principale', s.nom, [s.forme, s.siret?'SIRET '+s.siret:'', s.adresse, [s.tel,s.email].filter(Boolean).join(' - ')]);
  var h2=partyBlock(M+colW+8, startY, 'Sous-traitant', c.stNom, [c.stForme, c.stSiret?'SIRET '+c.stSiret:'', c.stAdresse, c.stRepresentant?'Represente par '+c.stRepresentant:'', [c.stTel,c.stEmail].filter(Boolean).join(' - ')]);
  y = startY + Math.max(h1,h2) + 8;

  arts.forEach(function(a,i){
    ensureSpace(16);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); setInk();
    doc.text(pdfSafe('Article '+(i+1)+' - '+a.title), M, y);
    y+=6;
    a.paragraphs.forEach(function(p){ paragraph(pdfSafe(p)); });
    y+=3;
  });

  ensureSpace(46);
  y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); setGray();
  doc.text('Fait a ..........................., le '+new Date().toLocaleDateString('fr-FR'), M, y);
  y+=18;
  doc.setDrawColor(180,180,180); doc.setLineWidth(0.3);
  doc.line(M,y,M+70,y);
  doc.line(pageW-M-70,y,pageW-M,y);
  y+=4.5; doc.setFontSize(8.3);
  doc.text('Signature de l\'Entreprise principale', M, y);
  doc.text('Signature du Sous-traitant (bon pour accord)', pageW-M-70, y);

  return doc;
}
async function downloadContratPdf(ch){
  var btn=document.getElementById('btnDownloadContratPdf');
  var canNativeSave = !!state.downloadsApi;
  var canBrowserDownload = !window.claude;
  if(!canNativeSave && !canBrowserDownload){
    alert('Le téléchargement direct n’est pas disponible dans cette vue.\nUtilisez "Aperçu / Imprimer" puis choisissez "Enregistrer au format PDF" dans la boîte d’impression.');
    return;
  }
  if(!(window.jspdf && window.jspdf.jsPDF)){
    alert('La bibliothèque PDF n’a pas pu se charger. Rechargez la page et réessayez.');
    return;
  }
  if(btn){ btn.disabled=true; btn.textContent='Génération…'; }
  try{
    var doc=buildContratPdf(ch);
    if(!doc) throw new Error('pdf_build_failed');
    var blob=doc.output('blob');
    var c=getContrat(ch);
    var safeName=(c.stNom||'').replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'');
    var filename='contrat-sous-traitance-'+(ch.numero||'chantier')+(safeName?'-'+safeName:'')+'.pdf';
    if(canNativeSave){
      var res=await state.downloadsApi.save({filename:filename, data:blob});
      if(btn){ btn.textContent = res.status==='saved' ? 'PDF enregistré ✓' : 'Contrat transmis ✓'; }
    } else {
      browserDownloadBlob(blob, filename);
      if(btn){ btn.textContent='PDF téléchargé ✓'; }
    }
  }catch(e){
    if(e && e.code==='declined'){ if(btn) btn.textContent='Télécharger le contrat (PDF)'; }
    else { alert('Enregistrement impossible : '+((e&&e.message)||'erreur inconnue')); if(btn) btn.textContent='Télécharger le contrat (PDF)'; }
  } finally {
    if(btn){ setTimeout(function(){ btn.disabled=false; if(btn.textContent.indexOf('✓')>-1) btn.textContent='Télécharger le contrat (PDF)'; },2200); }
  }
}

      tel:val('s_tel'), email:val('s_email'), iban:val('s_iban'), bic:val('s_bic'),
      tvaApplicable:document.getElementById('s_tva').checked,
      tvaPct:parseFloat(val('s_tvaPct'))||0,

    };

  };
  function val(id){ return document.getElementById(id).value; }
}

/* ---------------- top-level actions ---------------- */
async function createChantier(){
  var ch=newChantier(nextNumero());
  ch.id=null;
  await Store.saveChantier(ch);
  state.chantiers.unshift(ch);
  state.currentId=ch.id;
  state.wsTab='devis';
  renderAll();
}

function renderAll(){
  renderKpis();
  renderStatusChips();
  renderChantierList();
  renderOfflineNote();
  renderWorkspace();
}

/* ---------------- boot ---------------- */
document.getElementById('btnNew').onclick=createChantier;
document.getElementById('btnSettings').onclick=openSettingsModal;
document.getElementById('searchInput').addEventListener('input',function(e){ state.search=e.target.value; renderChantierList(); });
document.addEventListener('click',function(e){
  var delBtn=e.target.closest('[data-delid]');
  if(delBtn){
    e.stopPropagation();
    var delId=delBtn.getAttribute('data-delid');
    if(confirm('Supprimer ce devis définitivement ?')){
      Store.deleteChantier(delId).then(function(){
        if(state.currentId===delId){ state.currentId = state.chantiers.length ? state.chantiers[0].id : null; }
        renderAll();
      });
    }
    return;
  }
  var chip=e.target.closest('[data-filter]');
  if(chip){ state.statusFilter=chip.getAttribute('data-filter'); renderStatusChips(); renderChantierList(); return; }
  var item=e.target.closest('.chantier-item');
  if(item){ state.currentId=item.getAttribute('data-id'); state.wsTab='devis'; renderChantierList(); renderWorkspace(); }
});

Store.init().then(function(){
  if(!state.currentId && state.chantiers.length){ state.currentId=state.chantiers[0].id; }
  renderAll();
}).catch(function(){
  state.mode='local';
  renderAll();
});

})();
